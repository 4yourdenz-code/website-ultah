<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link rel="stylesheet" href="style.css">
</head><body id="bodyUcapan">
<div class="container ucapan-box">
  <h1 id="emoji">🎂</h1>
  <h1>Happy Birthday!</h1>
  <h2 id="namaUntuk">Kamu</h2>
  <p id="teksUcapan">Selamat Ulang Tahun!</p>
  <p>— Dari <b id="namaDari">Seseorang</b> —</p>
  <button id="btnMusik">▶️ Putar Musik</button>
  <button onclick="kasihKejutan()">🎁 Klik Buat Kejutan</button>
</div>
<audio id="musik" loop></audio>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script>
  const p = new URLSearchParams(location.search);
  const tema = p.get('tema') || 'romantis';
  const untuk = p.get('untuk') || 'Kamu';
  const dari = p.get('dari') || 'Seseorang';
  const ucapan = p.get('ucapan') || 'Selamat ulang tahun, semoga panjang umur & bahagia selalu!';
  document.getElementById('namaUntuk').innerText = untuk;
  document.getElementById('namaDari').innerText = dari;
  document.getElementById('teksUcapan').innerText = ucapan;
  const body = document.getElementById('bodyUcapan');
  const musik = document.getElementById('musik');
  if(tema === 'romantis'){
    body.classList.add('tema-romantis');
    document.getElementById('emoji').innerText = '💖🎂💖';
    musik.src = 'https://www.bensound.com/bensound-music/bensound-tenderness.mp3';
  } else {
    body.classList.add('tema-lucu');
    document.getElementById('emoji').innerText = '🎉🎂🥳';
    musik.src = 'https://www.bensound.com/bensound-music/bensound-happybirthday.mp3';
    setInterval(()=> confetti({particleCount: 80, spread: 100}), 2500);
  }
  document.getElementById('btnMusik').onclick = () => musik.play();
  function kasihKejutan(){
    confetti({particleCount: 300, spread: 120, origin:{y:0.6}});
    alert('Yeay! ' + untuk + ' makin tua deh 😆🎉');
  }
  confetti({particleCount: 200, spread: 100});
</script>
</body></html>
